name: Build JARVIS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            echo "gradlew wrapper script will be configured"
          fi

      - name: Verify Project Architecture (Pure Java & XML)
        run: |
          echo "Verifying absence of prohibited Kotlin/Compose files..."
          KOTLIN_FILES=$(find app/src -name "*.kt" 2>/dev/null | wc -l)
          if [ "$KOTLIN_FILES" -gt 0 ]; then
            echo "ERROR: Found $KOTLIN_FILES Kotlin files. Project must use Pure Java 17 only."
            exit 1
          fi
          echo "Verified: Pure Java 17 architecture compliant."

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper generated on project initialization."
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --continue
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
