name: Build JARVIS Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Is option se aap GitHub website se "Run workflow" button daba kar manually bhi APK build kar sakte hain

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Step 1: Repository code checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: Java 17 setup (Project requirement: Java 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Android SDK Setup (API 34)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Gradle wrapper check & execution permission
      - name: Prepare Gradle Wrapper
        run: |
          # Agar files kisi subfolder (jaise Jarvis--main) mein hon toh root par le aayen ya wahan navigate karein
          if [ ! -f "./gradlew" ] && [ -d "Jarvis--main" ]; then
            cd Jarvis--main
          fi

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

      # Step 5: Pure Java Architecture verification (Ensure no Kotlin compile conflicts)
      - name: Verify Pure Java Architecture
        run: |
          PROJECT_DIR="."
          if [ ! -d "app" ] && [ -d "Jarvis--main/app" ]; then
            PROJECT_DIR="Jarvis--main"
          fi
          
          if [ -d "$PROJECT_DIR/app/src" ]; then
            KOTLIN_COUNT=$(find $PROJECT_DIR/app/src -type f -name "*.kt" 2>/dev/null | wc -l)
            if [ "$KOTLIN_COUNT" -gt 0 ]; then
              echo "Error: Kotlin files detected. Jarvis requires pure Java 17."
              exit 1
            fi
            echo "Architecture Verified: 100% Pure Java & XML."
          fi

      # Step 6: Build Android Debug APK
      - name: Build Debug APK with Gradle
        run: |
          if [ ! -f "./gradlew" ] && [ -d "Jarvis--main" ]; then
            cd Jarvis--main
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      # Step 7: Upload generated APK as GitHub Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            Jarvis--main/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
