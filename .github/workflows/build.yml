name: Build JARVIS Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Step 1: Code Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: Java 17 Setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Accept Android Licenses (Ubuntu runner par SDK pehle se mojood hota hai)
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # Step 4: Make gradlew executable
      - name: Prepare Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          elif [ -f "Jarvis--main/gradlew" ]; then
            chmod +x Jarvis--main/gradlew
          else
            echo "Generating Gradle wrapper..."
            sudo apt-get update -qq && sudo apt-get install -y -qq gradle
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

      # Step 5: Build Debug APK
      - name: Build Debug APK with Gradle
        run: |
          if [ ! -f "./gradlew" ] && [ -d "Jarvis--main" ]; then
            cd Jarvis--main
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      # Step 6: Upload APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            Jarvis--main/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
