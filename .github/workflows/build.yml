name: Build JARVIS Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Step 1: Code Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: Java 17 Setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Modern Gradle 8.4 Setup (No outdated apt-get gradle)
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Step 4: Accept Android SDK Licenses
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # Step 5: Build Debug APK
      - name: Build Debug APK
        run: |
          # Agar files kisi subfolder mein hon (e.g. Jarvis--main)
          if [ ! -f "settings.gradle" ] && [ -d "Jarvis--main" ]; then
            cd Jarvis--main
          fi

          # Wrapper ensure karein modern Gradle 8.4 ke saath
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

          # APK Assemble karein
          ./gradlew assembleDebug --stacktrace --no-daemon

      # Step 6: Upload APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
